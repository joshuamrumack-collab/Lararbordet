name: Bygg och släpp

# Bygger Windows (.exe/.msi) och macOS (.dmg) och lägger dem, plus HTML-versionen,
# i en release som heter som versionen i src-tauri/tauri.conf.json (t.ex. v1.0.0).
# Körs vid varje push till main, eller manuellt under Actions.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npx tauri icon app-icon.png
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Lärarbordet v__VERSION__"
          releaseBody: |
            **Ladda ner den version som passar din dator:**
            - **Windows:** filen som slutar på `x64-setup.exe`
            - **Mac:** filen som slutar på `universal.dmg`
            - **Webbläsare / Chromebook:** `lararbordet.html`

            Se README för installation och vad du gör om datorn varnar för okänd utgivare. Av DorkTeach.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  html:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lägg till HTML-versionen i releasen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(jq -r .version src-tauri/tauri.conf.json)"
          cp dist/index.html lararbordet.html
          gh release upload "$TAG" lararbordet.html --clobber
