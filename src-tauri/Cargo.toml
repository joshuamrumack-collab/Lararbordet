[package]
name = "lararbordet"
version = "1.13.0"
description = "Lärarbordet – planering, årshjul, Lgr22-täckning och bedömning"
authors = ["DorkTeach"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/joshuamrumack-collab/Lararbordet"
edition = "2021"

[lib]
name = "lararbordet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
strip = true
lto = true
opt-level = "s"
