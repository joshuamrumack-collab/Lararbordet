<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lärarbordet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%201024%201024%22%3E%20%3Crect%20x%3D%2256%22%20y%3D%2256%22%20width%3D%22912%22%20height%3D%22912%22%20rx%3D%22210%22%20fill%3D%22%23f7f3ea%22/%3E%20%3Cg%20transform%3D%22translate%28512%20512%29%22%3E%20%3Cg%20fill%3D%22none%22%20stroke-width%3D%2296%22%20stroke-linecap%3D%22butt%22%3E%20%3Ccircle%20r%3D%22300%22%20stroke%3D%22%2324548a%22%20stroke-dasharray%3D%22439%201446%22%20transform%3D%22rotate%28-86%29%22/%3E%20%3Ccircle%20r%3D%22300%22%20stroke%3D%22%23f2b748%22%20stroke-dasharray%3D%22439%201446%22%20transform%3D%22rotate%284%29%22/%3E%20%3Ccircle%20r%3D%22300%22%20stroke%3D%22%233f8f6b%22%20stroke-dasharray%3D%22439%201446%22%20transform%3D%22rotate%2894%29%22/%3E%20%3Ccircle%20r%3D%22300%22%20stroke%3D%22%23e07a5f%22%20stroke-dasharray%3D%22439%201446%22%20transform%3D%22rotate%28184%29%22/%3E%20%3C/g%3E%20%3Crect%20x%3D%22-150%22%20y%3D%22-34%22%20width%3D%22300%22%20height%3D%2246%22%20rx%3D%2216%22%20fill%3D%22%231f3f66%22/%3E%20%3Crect%20x%3D%22-124%22%20y%3D%2212%22%20width%3D%2240%22%20height%3D%22124%22%20rx%3D%2212%22%20fill%3D%22%231f3f66%22/%3E%20%3Crect%20x%3D%2284%22%20y%3D%2212%22%20width%3D%2240%22%20height%3D%22124%22%20rx%3D%2212%22%20fill%3D%22%231f3f66%22/%3E%20%3Crect%20x%3D%22-96%22%20y%3D%22-118%22%20width%3D%22110%22%20height%3D%2284%22%20rx%3D%2210%22%20fill%3D%22%2324548a%22/%3E%20%3Ccircle%20cx%3D%2272%22%20cy%3D%22-80%22%20r%3D%2244%22%20fill%3D%22%23f2b748%22/%3E%20%3C/g%3E%20%3C/svg%3E%20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — topbar + tabbar (bottom on phone), each view a stack of panels; årshjulet är sidans signatur */
:root{
  --paper:#eef2f5; --surface:#ffffff; --ink:#16212c; --muted:#5a6977; --line:#d8e0e8;
  --accent:#24548a; --accent-ink:#ffffff; --soft:#e2ebf4;
  --ok:#2d7a4c; --ok-bg:#dcefe3; --warn:#9a6a12; --warn-bg:#f6ebd2; --bad:#ad3b33; --bad-bg:#f6dedb; --info:#24548a; --info-bg:#dde8f4;
  --gl:86%; --gink:#16212c;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f151b; --surface:#17202a; --ink:#e6edf3; --muted:#98a7b5; --line:#283443;
  --accent:#86b4e6; --accent-ink:#0c1620; --soft:#1c2a39;
  --ok:#7cc89a; --ok-bg:#183326; --warn:#e0b35a; --warn-bg:#33290f; --bad:#ec8b82; --bad-bg:#3a1d1a; --info:#86b4e6; --info-bg:#1a2b3e;
  --gl:30%; --gink:#eef3f7; color-scheme:dark; }}
:root[data-theme="dark"]{
  --paper:#0f151b; --surface:#17202a; --ink:#e6edf3; --muted:#98a7b5; --line:#283443;
  --accent:#86b4e6; --accent-ink:#0c1620; --soft:#1c2a39;
  --ok:#7cc89a; --ok-bg:#183326; --warn:#e0b35a; --warn-bg:#33290f; --bad:#ec8b82; --bad-bg:#3a1d1a; --info:#86b4e6; --info-bg:#1a2b3e;
  --gl:30%; --gink:#eef3f7; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}

header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.topin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.sync{margin-left:auto;border:0;cursor:pointer;font-size:.8rem;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.sync.err{background:var(--bad-bg);color:var(--bad)}
.sync.ok{background:var(--ok-bg);color:var(--ok)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;padding:4px 2px;border-radius:8px;min-width:0}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
@media (max-width:420px){nav.tabs a{font-size:.64rem}}
@media (min-width:860px){
  body{padding-bottom:24px}
  nav.tabs{position:sticky;top:57px;bottom:auto;justify-content:flex-start;gap:4px;padding:6px max(16px,calc((100vw - 1180px)/2));border-top:0;border-bottom:1px solid var(--line);background:var(--paper)}
  nav.tabs a{flex:none;flex-direction:row;font-size:.92rem;padding:8px 14px;gap:8px}
  nav.tabs a svg{width:18px;height:18px}
  nav.tabs a[aria-current="page"]{background:var(--soft)}
}
main{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.panel-h .sp{flex:1}
.grid2{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}.grid2.wide-l{grid-template-columns:1.3fr 1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:.92rem;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-klar,.p-covered{background:var(--ok-bg);color:var(--ok)}
.p-pagar,.p-ongoing{background:var(--info-bg);color:var(--info)}
.p-planerad,.p-planned{background:var(--soft);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-gap{background:var(--bad-bg);color:var(--bad)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.example{background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.example .sp{flex:1;min-width:180px}

/* Översikt-hjälte */
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:center}
@media (min-width:860px){.hero{grid-template-columns:1.1fr 1fr}}
.weekno{font-family:var(--display);font-weight:800;font-size:clamp(4rem,14vw,7.5rem);line-height:.85;letter-spacing:-.04em;color:var(--accent)}
.weekno small{font-size:.32em;letter-spacing:0;color:var(--muted);font-weight:700;margin-right:.2em}
.yearbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.yearbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.now-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.now{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.now .bar{width:4px;align-self:stretch;border-radius:4px}
.now .t{flex:1;min-width:0}
.now .t b{display:block}
.prog{height:4px;background:var(--soft);border-radius:4px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:currentColor}

/* täckningsstaplar */
.cov-row{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.cov-row:last-child{border-bottom:0}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--bad-bg)}
.stack i{display:block;height:100%}
.s-c{background:var(--ok)} .s-o{background:var(--info)} .s-p{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* listor */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{min-width:58px;font-weight:700;font-size:.86rem;color:var(--muted)}
.li .what{flex:1;min-width:0}
.flag{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}

/* planering: veckoband */
.strip-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.strip{position:relative}
.wkhead{display:flex;position:sticky;top:0}
.wk{flex:none;width:34px;text-align:center;font-size:.7rem;color:var(--muted);padding:4px 0;border-right:1px solid var(--line)}
.wk.lov{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 18%,transparent) 4px 6px)}
.wk.today{color:var(--accent);font-weight:700}
.lanes{position:relative}
.ubar{position:absolute;height:28px;border-radius:6px;color:#fff;font-size:.78rem;font-weight:700;padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0}
.ubar.planerad{background:transparent!important;border:2px dashed currentColor;color:var(--ink)}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.8}
.units{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.ucard{border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;border-left-width:5px}
.ucard .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}

/* årshjul */
.wheel{width:100%;max-width:560px;margin:0 auto;display:block}
.wheel text{fill:var(--ink);font-family:var(--body)}
.wheel .mlabel{font-size:12px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wheel .arc{cursor:pointer;transition:opacity .15s}
.wheel .arc:hover{opacity:.8}
.wheel .ring{fill:none;stroke:var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* centralt innehåll */
.area{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.area:first-of-type{border-top:0;margin-top:0;padding-top:0}
.area-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.item{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start}
.item:last-child{border-bottom:0}
.item.gap{box-shadow:inset 3px 0 0 var(--bad);padding-left:10px}
.item .txt{min-width:0}
.item .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ulink{font-size:.76rem;border-radius:99px;padding:1px 8px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.check{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:16px;height:16px}

/* bedömning */
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.mx{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:.9rem}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
.mx thead th{background:var(--paper);font-weight:700;font-size:.8rem;padding:8px 6px;vertical-align:bottom;min-width:84px;max-width:120px;cursor:pointer}
.mx thead th .d{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.mx th.name,.mx td.name{position:sticky;left:0;background:var(--surface);text-align:left;z-index:2;min-width:130px;max-width:170px}
.mx thead th.name{background:var(--paper);z-index:3}
.mx td.name button{background:none;border:0;padding:8px 10px;width:100%;text-align:left;cursor:pointer;font-weight:700}
.cell{width:100%;min-height:40px;border:0;background:transparent;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;padding:6px}
.cell.g{background:hsl(var(--h) 52% var(--gl));color:var(--gink)}
.cell .n{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.mx tfoot td{background:var(--paper);padding:6px;vertical-align:top}
.dist{display:flex;height:22px;align-items:flex-end;gap:2px;justify-content:center}
.dist i{width:8px;border-radius:2px 2px 0 0;background:hsl(var(--h) 52% 50%)}
.sum{font-weight:700;padding:6px 8px}
.lowtag{color:var(--bad);font-weight:700}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ov{align-items:center;padding:20px}}
.modal{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.modal{border-radius:14px}}
.modal-h{display:flex;align-items:center;gap:10px}
.modal-h h2{flex:1}
.x{background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:.84rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;width:100%}
.f textarea{min-height:90px;resize:vertical}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media (max-width:420px){.row{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions .sp{flex:1}
.cl{border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto;padding:4px 10px}
.cl h4{margin:10px 0 4px;font-size:.82rem;color:var(--muted);font-family:var(--display)}
.cl label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:.9rem;cursor:pointer}
.cl input{margin-top:4px;width:18px;height:18px;flex:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.lv{border:2px solid transparent;border-radius:10px;padding:12px 6px;font-weight:700;cursor:pointer;background:hsl(var(--h) 52% var(--gl));color:var(--gink);font-size:.95rem;line-height:1.2}
.lv[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .sp{flex:1}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}
.kpis{display:flex;gap:22px;flex-wrap:wrap}
.kpi b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><svg width="30" height="30" viewBox="152 152 720 720" aria-hidden="true"><g transform="translate(512 512)"> <g fill="none" stroke-width="96" stroke-linecap="butt"> <circle r="300" stroke="var(--accent)" stroke-dasharray="439 1446" transform="rotate(-86)"/> <circle r="300" stroke="#f2b748" stroke-dasharray="439 1446" transform="rotate(4)"/> <circle r="300" stroke="#3f8f6b" stroke-dasharray="439 1446" transform="rotate(94)"/> <circle r="300" stroke="#e07a5f" stroke-dasharray="439 1446" transform="rotate(184)"/> </g> <rect x="-150" y="-34" width="300" height="46" rx="16" fill="var(--ink)"/> <rect x="-124" y="12" width="40" height="124" rx="12" fill="var(--ink)"/> <rect x="84" y="12" width="40" height="124" rx="12" fill="var(--ink)"/> <rect x="-96" y="-118" width="110" height="84" rx="10" fill="var(--accent)"/> <circle cx="72" cy="-80" r="44" fill="#f2b748"/> </g> </svg>Lärarbordet</div>
  <button class="sync" id="sync" data-a="save" title="Sparar all data i den här HTML-filen (Ctrl/Cmd+S)">Spara till fil</button>
</div></header>
<nav class="tabs" id="tabs" aria-label="Vyer"></nav>
<main id="main"></main>
<div id="modalroot"></div>
<script type="application/json" id="pbdata">null</script>
<input type="file" id="importfile" accept="application/json,.json,text/html,.html" hidden>

<script>
"use strict";
/* ---------- hjälpfunktioner ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const fmtD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

/* ---------- härledda data ---------- */
const course=id=>state.courses.find(c=>c.id===id);
const unit=id=>state.units.find(u=>u.id===id);
const group=id=>state.groups.find(g=>g.id===id);
const subj=id=>state.subjects[id];
const allItems=sid=>{const s=subj(sid);return s?s.areas.flatMap(a=>a.items):[]};
function coverage(sid,courseFilter){
 const res={};const items=allItems(sid);items.forEach(i=>res[i.id]={state:"gap",units:[],assessed:false,manual:!!state.manual[i.id]});
 const rank={gap:0,planned:1,ongoing:2,covered:3};const map={planerad:"planned",pagar:"ongoing",klar:"covered"};
 const cs=state.courses.filter(c=>c.subjectId===sid&&(courseFilter==="all"||!courseFilter||c.id===courseFilter)).map(c=>c.id);
 state.units.filter(u=>cs.includes(u.courseId)).forEach(u=>(u.contentIds||[]).forEach(id=>{const r=res[id];if(!r)return;r.units.push(u);const st=map[u.status]||"planned";if(rank[st]>rank[r.state])r.state=st}));
 state.assessments.filter(a=>cs.includes(a.courseId)).forEach(a=>{const u=unit(a.unitId);(u?u.contentIds:[]).forEach(id=>{if(res[id])res[id].assessed=true})});
 Object.values(res).forEach(r=>{if(r.manual)r.state="covered"});
 return res}
function covSummary(sid,cf){const c=coverage(sid,cf);const v=Object.values(c);const n=v.length||1;const k=s=>v.filter(x=>x.state===s).length;return {n:v.length,covered:k("covered"),ongoing:k("ongoing"),planned:k("planned"),gap:k("gap"),pct:Math.round(k("covered")/n*100)}}
const usedSubjects=()=>{const s=[...new Set(state.courses.map(c=>c.subjectId))].filter(subj);return s.length?s:Object.keys(state.subjects)};
function yearWeeks(){const out=[];let d=mondayOf(parseD(state.year.start));const end=parseD(state.year.end);while(d<=end){out.push(new Date(d));d=addDays(d,7)}return out}
const inLov=d=>state.events.some(e=>e.type==="lov"&&parseD(e.start)<=addDays(d,4)&&parseD(e.end)>=d);
function studentSummary(gid,sid,courseFilter){const vals=[];let low=0,missing=0;state.assessments.filter(a=>a.groupId===gid&&(courseFilter==="all"||a.courseId===courseFilter)).forEach(a=>{const g=(state.grades[a.id]||{})[sid];if(g&&lvIdx(g.k)>=0){vals.push(lvIdx(g.k));if(isLow(g.k))low++}else missing++});const m=median(vals);return {m,low,missing,count:vals.length}}

function route(){const h=(location.hash||"").slice(1);return TABS.some(t=>t[0]===h)?h:"oversikt"}
function renderTabs(){const r=route();$("#tabs").innerHTML=TABS.map(([id,l])=>`<a href="#${id}" ${r===id?'aria-current="page"':""}>${ICON[id]}<span>${l==="Centralt innehåll"?'<span class="lg">Centralt innehåll</span>':l}</span></a>`).join("")}
function exampleBanner(){return state.example?`<div class="example"><span class="sp"><b>Exempeldata.</b> Kurserna, eleverna och omdömena här är påhittade så att du ser hur allt hänger ihop.</span><button class="btn" data-a="clear-example">Börja med tomt bord</button></div>`:""}
function render(){renderTabs();const r=route();const m=$("#main");
 const v={oversikt:vOverview,planering:vPlanning,arshjul:vWheel,innehall:vContent,bedomning:vAssess,installningar:vSettings}[r];
 m.innerHTML=exampleBanner()+v();}

function vOverview(){
 const ys=parseD(state.year.start),ye=parseD(state.year.end);const pct=Math.max(0,Math.min(100,Math.round((TODAY-ys)/(ye-ys)*100)));
 const active=state.units.filter(u=>parseD(u.start)<=TODAY&&parseD(u.end)>=TODAY||u.status==="pagar").filter((u,i,a)=>a.indexOf(u)===i);
 const nowHtml=active.length?active.map(u=>{const c=course(u.courseId)||{};const s=parseD(u.start),e=parseD(u.end);const p=Math.max(0,Math.min(100,Math.round((TODAY-s)/(e-s||1)*100)));
   return `<button class="now" data-a="edit-unit" data-id="${u.id}"><span class="bar" style="background:${c.color}"></span><span class="t"><span class="small muted">${esc(c.name||"")} · ${wkRange(u.start,u.end)}</span><b>${esc(u.title)}</b><span class="prog" style="color:${c.color}"><i style="width:${p}%"></i></span></span><span class="pill p-${u.status}">${STATUS[u.status]}</span></button>`}).join(""):`<div class="empty">Inget arbetsområde pågår just nu. <a href="#planering">Planera ett</a>.</div>`;
 const cov=usedSubjects().map(sid=>{const s=covSummary(sid,"all");const n=s.n||1;return `<button class="cov-row" data-a="goto-subject" data-id="${sid}"><b>${esc(subj(sid).name)} <span class="muted small">${esc(subj(sid).stage||"")}</span></b><span class="stack" role="img" aria-label="${s.covered} av ${s.n} täckta"><i class="s-c" style="width:${s.covered/n*100}%"></i><i class="s-o" style="width:${s.ongoing/n*100}%"></i><i class="s-p" style="width:${s.planned/n*100}%"></i></span><span class="num small">${s.pct} % ${s.gap?`<span class="pill p-gap">${s.gap} luckor</span>`:""}</span></button>`}).join("");
 const horizon=addDays(TODAY,35);
 const up=[...state.events.filter(e=>parseD(e.end)>=TODAY&&parseD(e.start)<=horizon).map(e=>({d:e.start,t:e.title,k:e.type==="lov"?"Lov":e.type==="deadline"?"Deadline":"Händelse",c:"var(--muted)"})),
  ...state.units.filter(u=>parseD(u.start)>TODAY&&parseD(u.start)<=horizon).map(u=>({d:u.start,t:u.title,k:"Startar · "+((course(u.courseId)||{}).name||""),c:(course(u.courseId)||{}).color})),
  ...state.assessments.filter(a=>parseD(a.date)>=TODAY&&parseD(a.date)<=horizon).map(a=>({d:a.date,t:a.title,k:"Bedömning · "+((course(a.courseId)||{}).name||""),c:(course(a.courseId)||{}).color}))].sort((a,b)=>a.d<b.d?-1:1);
 const upHtml=up.length?`<div class="list">${up.map(x=>`<div class="li"><span class="when num">v.${isoWeek(parseD(x.d))}<br><span class="small">${shortD(x.d)}</span></span><span class="what"><b>${esc(x.t)}</b><br><span class="small muted"><span class="dot" style="background:${x.c}"></span> ${esc(x.k)}</span></span></div>`).join("")}</div>`:`<div class="empty">Inget inplanerat de närmaste fem veckorna.</div>`;
 const flags=[];state.groups.forEach(g=>g.students.forEach(s=>{const sm=studentSummary(g.id,s.id,"all");if(sm.low>=2)flags.push({g,s,sm})}));
 let ungraded=0,cells=0;state.assessments.filter(a=>parseD(a.date)<=TODAY).forEach(a=>{const g=group(a.groupId);if(!g)return;g.students.forEach(s=>{cells++;if(!((state.grades[a.id]||{})[s.id]))ungraded++})});
 const flagHtml=flags.length?flags.map(f=>`<button class="flag" data-a="student" data-g="${f.g.id}" data-id="${f.s.id}"><span class="pill p-gap">${f.sm.low} låga</span><b style="flex:1">${esc(f.s.name)}</b><span class="small muted">${esc(f.g.name)}</span></button>`).join(""):`<p class="muted small">Ingen elev har två eller fler omdömen under godtagbar nivå.</p>`;
 return `<section class="panel hero">
  <div><div class="weekno num"><small>v.</small>${isoWeek(TODAY)}</div>
   <p style="margin:10px 0 0"><b>${DAY[TODAY.getDay()][0].toUpperCase()+DAY[TODAY.getDay()].slice(1)} ${TODAY.getDate()} ${MON[TODAY.getMonth()]}</b> <span class="muted">· läsår ${state.year.start.slice(2,4)}/${state.year.end.slice(2,4)}</span></p>
   <div class="yearbar" aria-label="${pct} procent av läsåret"><i style="width:${pct}%"></i></div><span class="small muted num">${pct} % av läsåret har gått</span>
   <h2 style="margin-top:18px">Just nu</h2><div class="now-list">${nowHtml}</div></div>
  <div><a href="#arshjul" aria-label="Öppna årshjulet" style="display:block">${wheelSVG("all",true)}</a></div>
 </section>
 <div class="grid2">
  <section class="panel"><div class="panel-h"><h2>Täckning av centralt innehåll</h2><span class="sp"></span><a class="btn ghost" href="#innehall">Visa luckor</a></div>${cov}
   <div class="legend"><span><i class="s-c"></i>Genomfört</span><span><i class="s-o"></i>Pågår</span><span><i class="s-p"></i>Planerat</span><span><i style="background:var(--bad-bg)"></i>Lucka</span></div></section>
  <section class="panel"><div class="panel-h"><h2>Kommande fem veckor</h2></div>${upHtml}</section>
 </div>
 <section class="panel"><div class="panel-h"><h2>Bedömning</h2><span class="sp"></span><a class="btn ghost" href="#bedomning">Öppna matrisen</a></div>
  <div class="kpis" style="margin-bottom:12px"><div class="kpi"><b class="num">${state.assessments.length}</b><span>bedömningar</span></div><div class="kpi"><b class="num">${state.groups.reduce((n,g)=>n+g.students.length,0)}</b><span>elever</span></div><div class="kpi"><b class="num" style="color:${ungraded?"var(--warn)":"inherit"}">${ungraded}</b><span>saknade omdömen av ${cells}</span></div><div class="kpi"><b class="num" style="color:${flags.length?"var(--bad)":"inherit"}">${flags.length}</b><span>elever att uppmärksamma</span></div></div>
  ${flagHtml}</section>`;
}

function vPlanning(){
 if(!state.courses.length)return `<section class="panel"><div class="empty"><p>Du har inga kurser ännu.</p><button class="btn pri" data-a="new-course">Skapa första kursen</button></div></section>`;
 if(!course(ui.course))ui.course=state.courses[0].id;const c=course(ui.course);
 const chips=state.courses.map(x=>`<button class="chip" aria-pressed="${x.id===c.id}" data-a="sel-course" data-id="${x.id}"><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</button>`).join("");
 const weeks=yearWeeks();const CW=34;const us=state.units.filter(u=>u.courseId===c.id).sort((a,b)=>a.start<b.start?-1:1);
 const lanes=[];const placed=us.map(u=>{const si=Math.max(0,weeks.findIndex(w=>addDays(w,6)>=parseD(u.start)));let ei=weeks.findIndex(w=>addDays(w,6)>=parseD(u.end));if(ei<0)ei=weeks.length-1;let lane=lanes.findIndex(l=>l<si);if(lane<0){lane=lanes.length;lanes.push(ei)}else lanes[lane]=ei;return {u,si,ei,lane}});
 const ti=weeks.findIndex(w=>w<=TODAY&&addDays(w,7)>TODAY);
 const strip=`<div class="strip-wrap" id="stripwrap"><div class="strip" style="width:${weeks.length*CW}px"><div class="wkhead">${weeks.map((w,i)=>`<div class="wk ${inLov(w)?"lov":""} ${i===ti?"today":""}">${isoWeek(w)}</div>`).join("")}</div>
  <div class="lanes" style="height:${Math.max(1,lanes.length)*34+8}px">${placed.map(p=>`<button class="ubar ${p.u.status}" data-a="edit-unit" data-id="${p.u.id}" style="left:${p.si*CW+2}px;width:${(p.ei-p.si+1)*CW-4}px;top:${p.lane*34+4}px;background:${c.color};color:${p.u.status==="planerad"?c.color:"#fff"}" title="${esc(p.u.title)}">${esc(p.u.title)}</button>`).join("")}${ti>=0?`<span class="todayline" style="left:${ti*CW+CW/2}px"></span>`:""}</div></div></div>`;

 const cards=us.length?`<div class="units">${us.map(u=>{const na=state.assessments.filter(a=>a.unitId===u.id).length;return `<button class="ucard" data-a="edit-unit" data-id="${u.id}" style="border-left-color:${c.color}"><span class="meta"><span class="pill p-${u.status}">${STATUS[u.status]}</span><span class="num">${wkRange(u.start,u.end)}</span></span><b>${esc(u.title)}</b>${u.desc?`<span class="small muted">${esc(u.desc)}</span>`:""}<span class="meta"><span>${(u.contentIds||[]).length} delar av centralt innehåll</span>${na?`<span>· ${na} bedömning${na>1?"ar":""}</span>`:""}</span></button>`}).join("")}</div>`:`<div class="empty">Inga arbetsområden ännu.</div>`;
 const sum=covSummary(c.subjectId,c.id);
 return `<section class="panel"><div class="toolbar"><div class="chips">${chips}</div><span class="sp"></span><button class="btn" data-a="new-course">+ Ny kurs</button></div></section>
 <section class="panel"><div class="panel-h"><span class="dot" style="background:${c.color};width:14px;height:14px"></span><h1>${esc(c.name)}</h1><span class="sp"></span><button class="btn" data-a="edit-course" data-id="${c.id}">Redigera kurs</button><button class="btn pri" data-a="new-unit">+ Arbetsområde</button></div>

function arcPath(r1,r2,a1,a2){const p=(r,a)=>[(r*Math.cos(a)).toFixed(2),(r*Math.sin(a)).toFixed(2)];const large=a2-a1>Math.PI?1:0;const [x1,y1]=p(r2,a1),[x2,y2]=p(r2,a2),[x3,y3]=p(r1,a2),[x4,y4]=p(r1,a1);return `M${x1} ${y1}A${r2} ${r2} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 ${large} 0 ${x4} ${y4}Z`}
function wheelSVG(filter,mini){
 const y0=parseD(state.year.start).getFullYear();const anchor=new Date(y0,7,1);const span=new Date(y0+1,7,1)-anchor;
 const ang=d=>((parseD(typeof d==="string"?d:fmtD(d))-anchor)/span)*Math.PI*2-Math.PI/2;
 const cs=state.courses.filter(c=>filter==="all"||c.id===filter);const R0=78,R1=196;const n=Math.max(cs.length,1);const rw=(R1-R0)/n;
 let s=`<svg class="wheel" viewBox="-250 -250 500 500" role="img" aria-label="Årshjul för läsåret">`;
 for(let m=0;m<12;m++){const a=((new Date(y0,7+m,1)-anchor)/span)*Math.PI*2-Math.PI/2;const am=((new Date(y0,7+m,15)-anchor)/span)*Math.PI*2-Math.PI/2;
  s+=`<line x1="${(R0-6)*Math.cos(a)}" y1="${(R0-6)*Math.sin(a)}" x2="${222*Math.cos(a)}" y2="${222*Math.sin(a)}" stroke="var(--line)"/>`;
  s+=`<text class="mlabel" x="${(234*Math.cos(am)).toFixed(1)}" y="${(234*Math.sin(am)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${MON[(7+m)%12]}</text>`}
 cs.forEach((c,i)=>{const r1=R0+i*rw+2,r2=R0+(i+1)*rw-2;s+=`<circle class="ring" r="${(r1+r2)/2}" stroke-width="${r2-r1}" style="stroke:var(--soft)"/>`;
  state.units.filter(u=>u.courseId===c.id).forEach(u=>{const a1=ang(u.start),a2=ang(fmtD(addDays(parseD(u.end),1)));if(a2<=a1)return;
   const op=u.status==="planerad"?.45:u.status==="pagar"?.85:1;s+=`<path class="arc" ${mini?"":`data-a="edit-unit" data-id="${u.id}" tabindex="0"`} d="${arcPath(r1,r2,a1,a2-0.004)}" fill="${c.color}" opacity="${op}"><title>${esc(c.name)}: ${esc(u.title)} (${wkRange(u.start,u.end)})</title></path>`})});
 state.events.forEach(e=>{const a1=ang(e.start),a2=ang(fmtD(addDays(parseD(e.end),1)));const col=e.type==="lov"?"var(--muted)":e.type==="deadline"?"var(--bad)":"var(--warn)";
  if(a2-a1>0.03)s+=`<path d="${arcPath(201,211,a1,a2)}" fill="${col}" opacity=".7"><title>${esc(e.title)}</title></path>`;else s+=`<circle cx="${206*Math.cos(a1)}" cy="${206*Math.sin(a1)}" r="5" fill="${col}"><title>${esc(e.title)} ${shortD(e.start)}</title></circle>`});
 const at=ang(TODAY);s+=`<line x1="${(R0-10)*Math.cos(at)}" y1="${(R0-10)*Math.sin(at)}" x2="${216*Math.cos(at)}" y2="${216*Math.sin(at)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="${216*Math.cos(at)}" cy="${216*Math.sin(at)}" r="5" fill="var(--ink)"/>`;
 s+=`<text x="0" y="-8" text-anchor="middle" style="font-family:var(--display);font-weight:800;font-size:30px">v.${isoWeek(TODAY)}</text><text x="0" y="18" text-anchor="middle" style="font-size:12px;fill:var(--muted)">läsår ${state.year.start.slice(2,4)}/${state.year.end.slice(2,4)}</text></svg>`;
 return s}

 if(ui.wheel!=="all"&&!course(ui.wheel))ui.wheel="all";

function vContent(){
 const subs=Object.values(state.subjects);if(!subj(ui.subject))ui.subject=subs[0].id;const s=subj(ui.subject);

 const areas=s.areas.map(a=>{const items=a.items.filter(i=>!ui.gapsOnly||cov[i.id].state==="gap");const ac=a.items.filter(i=>cov[i.id].state==="covered").length;

  ${items.map(i=>{const r=cov[i.id];const lab={covered:"Genomfört",ongoing:"Pågår",planned:"Planerat",gap:"Lucka"}[r.state];
   return `<div class="item ${r.state==="gap"?"gap":""}"><button class="check" role="checkbox" aria-checked="${r.manual}" aria-label="Markera som täckt utanför planeringen" title="Markera som täckt utanför planeringen" data-a="toggle-manual" data-id="${i.id}">${r.manual?CHECK:""}</button>

function vAssess(){

 if(ui.acourse!=="all"&&!gcourses.some(c=>c.id===ui.acourse))ui.acourse="all";
 const as=state.assessments.filter(a=>a.groupId===g.id&&(ui.acourse==="all"||a.courseId===ui.acourse)).sort((a,b)=>(a.courseId+a.date)<(b.courseId+b.date)?-1:1);

 const rows=g.students.map(s=>{const sm=studentSummary(g.id,s.id,ui.acourse);const mk=sm.m==null?null:sc.levels[sm.m];
  return `<tr><td class="name"><button data-a="student" data-g="${g.id}" data-id="${s.id}">${esc(s.name)}</button></td>${as.map(a=>{const v=(state.grades[a.id]||{})[s.id];const t=v?lvT(v.k):null;
   return `<td><button class="cell ${t!=null?"g":""}" style="${t!=null?`--h:${hueT(t)}`:""}" data-a="grade" data-as="${a.id}" data-st="${s.id}" aria-label="${esc(s.name)}, ${esc(a.title)}: ${v?esc(v.k):"ej bedömt"}">${v?esc(v.k):'<span class="muted">·</span>'}${v&&v.note?'<span class="n" title="Anteckning"></span>':""}</button></td>`}).join("")}
   <td class="sum ${mk&&mk.low?"lowtag":""}">${mk?esc(mk.k):"–"}</td><td class="sum">${sm.low?`<span class="lowtag">${sm.low}</span>`:"0"}</td></tr>`}).join("");
 const foot=as.map(a=>{const counts=sc.levels.map(l=>g.students.filter(s=>((state.grades[a.id]||{})[s.id]||{}).k===l.k).length);const mx=Math.max(1,...counts);const done=counts.reduce((x,y)=>x+y,0);

 const total=as.length*g.students.length;const done=as.reduce((n,a)=>n+g.students.filter(s=>(state.grades[a.id]||{})[s.id]).length,0);
 return `<section class="panel"><div class="toolbar"><div class="chips">${state.groups.map(x=>`<button class="chip" aria-pressed="${x.id===g.id}" data-a="sel-group" data-id="${x.id}">${esc(x.name)}</button>`).join("")}</div><button class="btn" data-a="edit-group">+ Elevgrupp</button><span class="sp"></span>
  <select class="inline" id="acourse" aria-label="Filtrera på kurs"><option value="all">Alla kurser</option>${gcourses.map(c=>`<option value="${c.id}" ${ui.acourse===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div></section>
 <section class="panel"><div class="panel-h"><h1>${esc(g.name)}</h1><span class="muted small num">${g.students.length} elever · ${done}/${total} omdömen · skala: ${esc(sc.name)}</span><span class="sp"></span>
  <button class="btn" data-a="edit-group" data-id="${g.id}">Elever</button><button class="btn" data-a="export-csv">Exportera CSV</button><button class="btn pri" data-a="new-assess">+ Bedömning</button></div>
  ${!g.students.length?`<div class="empty">Gruppen har inga elever. Tryck på Elever och klistra in namnen.</div>`:!as.length?`<div class="empty">Inga bedömningar ännu för det här urvalet.</div>`:
  `<div class="mx-wrap"><table class="mx"><thead><tr><th class="name">Elev</th>${head}<th title="Medianen av elevens omdömen">Typnivå</th><th title="Antal omdömen under godtagbar nivå">Låga</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td class="name small muted" style="padding:8px 10px">Fördelning</td>${foot}<td></td><td></td></tr></tfoot></table></div>
  <p class="small muted" style="margin:8px 0 0">Tryck på en ruta för att sätta omdöme och anteckning. Typnivå är medianen av elevens omdömen och ersätter inte en samlad bedömning mot betygskriterierna. En prick betyder att det finns en anteckning.</p>`}</section>`;
}

 <div class="row"><div class="f"><label for="ad">Datum</label><input type="date" id="ad" value="${d.date}"></div><div class="f"><label for="ac">Kurs</label><select id="ac">${cs.map(c=>`<option value="${c.id}" ${d.courseId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div></div>
 <div class="f"><label for="au">Arbetsområde</label><select id="au">${unitOpts(d.courseId)}</select><span class="small muted">Kopplingen gör att innehållet räknas som bedömt.</span></div>
 <div class="f"><label for="ade">Uppgift och bedömningsaspekter</label><textarea id="ade" placeholder="Vad bedöms? Vilka delar av betygskriterierna?">${esc(d.desc||"")}</textarea></div>
 <div class="actions">${a?'<button class="btn danger" id="adel">Ta bort</button>':""}<span class="sp"></span><button class="btn" data-a="close">Avbryt</button><button class="btn pri" id="asave">Spara</button></div>`,m=>{
  m.querySelector("#ac").onchange=e=>{d.unitId="";m.querySelector("#au").innerHTML=unitOpts(e.target.value)};
  m.querySelector("#asave").onclick=()=>{const t=val("at").trim();if(!t){$("#at").focus();return}if(!val("ac"))return;const o={title:t,date:val("ad"),courseId:val("ac"),unitId:val("au"),desc:val("ade")};
   if(a)Object.assign(a,o);else state.assessments.push(Object.assign({id:uid(),groupId:g.id},o));closeModal();commit()};
  const del=m.querySelector("#adel");if(del)del.onclick=()=>confirmBox(`Ta bort “${esc(a.title)}” och alla omdömen på den?`,()=>{delete state.grades[a.id];state.assessments=state.assessments.filter(x=>x!==a);commit()})})}

function gradeModal(aid,sid){const a=state.assessments.find(x=>x.id===aid);const g=group(a.groupId);const s=g.students.find(x=>x.id===sid);if(!a||!s)return;
 const cur=(state.grades[aid]||{})[sid]||{k:"",note:""};let pick=cur.k;const sc=scale();const idx=g.students.indexOf(s);const next=g.students[idx+1];
 modal(s.name,`<p class="small muted" style="margin:-8px 0 0">${esc(a.title)} · ${shortD(a.date)} · ${esc((course(a.courseId)||{}).name||"")}</p>
 <div class="levels">${sc.levels.map((l,i)=>`<button class="lv" style="--h:${hueT(i/(sc.levels.length-1))}" aria-pressed="${pick===l.k}" data-k="${l.k}">${esc(l.l)}</button>`).join("")}</div>
 <div class="f"><label for="gnote">Anteckning till eleven eller dig själv</label><textarea id="gnote" placeholder="Styrkor, nästa steg, anpassningar…">${esc(cur.note||"")}</textarea></div>
 <div class="actions">${cur.k?'<button class="btn danger" id="gclr">Rensa</button>':""}<span class="sp"></span>${next?'<button class="btn" id="gnext">Spara och nästa elev</button>':""}<button class="btn pri" id="gsave">Spara</button></div>`,m=>{
  m.querySelectorAll(".lv").forEach(b=>b.onclick=()=>{pick=pick===b.dataset.k?"":b.dataset.k;m.querySelectorAll(".lv").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===pick))});
  const save=()=>{state.grades[aid]=state.grades[aid]||{};const note=val("gnote").trim();if(pick||note)state.grades[aid][sid]={k:pick,note};else delete state.grades[aid][sid];commit()};
  m.querySelector("#gsave").onclick=()=>{closeModal();save()};
  const nx=m.querySelector("#gnext");if(nx)nx.onclick=()=>{save();gradeModal(aid,next.id)};
  const cl=m.querySelector("#gclr");if(cl)cl.onclick=()=>{delete state.grades[aid][sid];closeModal();commit()}})}

function studentModal(gid,sid){const g=group(gid);const s=g&&g.students.find(x=>x.id===sid);if(!s)return;
 const as=state.assessments.filter(a=>a.groupId===gid).sort((a,b)=>a.date<b.date?-1:1);const byC={};as.forEach(a=>(byC[a.courseId]=byC[a.courseId]||[]).push(a));const sc=scale();
 const body=Object.entries(byC).map(([cid,list])=>{const c=course(cid)||{name:"Okänd kurs"};const sm=studentSummary(gid,sid,cid);const mk=sm.m==null?null:sc.levels[sm.m];
  return `<div><div class="area-h"><span class="dot" style="background:${c.color}"></span><h3>${esc(c.name)}</h3><span class="sp" style="flex:1"></span><span class="small">Typnivå <b class="${mk&&mk.low?"lowtag":""}">${mk?esc(mk.l):"–"}</b></span></div>
  <div class="list">${list.map(a=>{const v=(state.grades[a.id]||{})[sid];const t=v?lvT(v.k):null;return `<div class="li"><span class="when num">${shortD(a.date)}</span><span class="what"><b>${esc(a.title)}</b>${v&&v.note?`<br><span class="small muted">${esc(v.note)}</span>`:""}</span><button class="cell ${t!=null?"g":""}" style="width:auto;min-width:52px;border-radius:8px;${t!=null?`--h:${hueT(t)}`:""}" data-a="grade" data-as="${a.id}" data-st="${sid}">${v&&v.k?esc(v.k):'<span class="muted small">Ej bedömt</span>'}</button></div>`}).join("")}</div></div>`}).join("");
 const all=studentSummary(gid,sid,"all");
 modal(s.name,`<p class="small muted" style="margin:-8px 0 0">${esc(g.name)} · ${all.count} omdömen · ${all.low} under godtagbar nivå · ${all.missing} saknas</p>${body||'<div class="empty">Inga bedömningar ännu.</div>'}`)}

function subjectModal(){modal("Eget ämne",`<div class="row"><div class="f"><label for="sn">Ämne</label><input id="sn" placeholder="t.ex. Bild"></div><div class="f"><label for="sst">Stadium</label><input id="sst" value="7–9"></div></div>
 <div class="f"><label for="sc">Centralt innehåll</label><textarea id="sc" style="min-height:220px" placeholder="# Bildframställning&#10;Framställning av berättande och informativa bilder&#10;Tekniker för teckning och måleri&#10;# Redskap för bildframställning&#10;..."></textarea><span class="small muted">Rader som börjar med # blir kunskapsområden. Övriga rader blir punkter. Kopiera gärna från kursplanen på skolverket.se.</span></div>
 <div class="actions"><span class="sp"></span><button class="btn" data-a="close">Avbryt</button><button class="btn pri" id="ssave">Spara</button></div>`,m=>m.querySelector("#ssave").onclick=()=>{const n=val("sn").trim();if(!n){$("#sn").focus();return}const sid="x"+uid();const areas=[];let cur=null;
  val("sc").split(/\r?\n/).map(l=>l.trim().replace(/^[-•*]\s*/,"")).filter(Boolean).forEach(l=>{if(l.startsWith("#")){cur={id:sid+"-"+(areas.length+1),name:l.replace(/^#+\s*/,""),items:[]};areas.push(cur)}else{if(!cur){cur={id:sid+"-1",name:"Centralt innehåll",items:[]};areas.push(cur)}cur.items.push({id:cur.id+"-"+(cur.items.length+1),text:l})}});
  state.subjects[sid]={id:sid,name:n,stage:val("sst"),areas};ui.subject=sid;saveUI();closeModal();commit()})}

function addItemModal(areaId){const s=subj(ui.subject);const a=s.areas.find(x=>x.id===areaId);modal("Eget innehåll",`<p class="small muted" style="margin:-8px 0 0">${esc(s.name)} · ${esc(a.name)}</p><div class="f"><label for="it">Formulering</label><textarea id="it" placeholder="t.ex. Lokalt mål: digital kompetens i skrivprocessen"></textarea></div><div class="actions"><span class="sp"></span><button class="btn" data-a="close">Avbryt</button><button class="btn pri" id="isave">Lägg till</button></div>`,m=>m.querySelector("#isave").onclick=()=>{const t=val("it").trim();if(!t)return;a.items.push({id:a.id+"-c"+uid(),text:t,custom:true});closeModal();commit()})}

/* ---------- export / import ---------- */
async function offerFile(filename,data,mime){
 if(DESKTOP){try{const ext=filename.split(".").pop();const p=await T.dialog.save({defaultPath:await T.path.join(await T.path.documentDir(),filename),filters:[{name:ext.toUpperCase(),extensions:[ext]}]});if(p)await T.fs.writeTextFile(p,data)}catch(e){modal("Kunde inte spara",`<p style="margin:0">Filen kunde inte skrivas. Välj en annan mapp och försök igen.</p><div class="actions"><button class="btn pri" data-a="close">OK</button></div>`)}return}
 try{downloadBlob(filename,data,mime)}catch(e){modal("Kopiera data",`<p class="small" style="margin:0">Nedladdning gick inte. Kopiera texten och spara den som <b>${esc(filename)}</b>.</p><div class="f"><textarea id="cp" style="min-height:220px" readonly>${esc(data)}</textarea></div>`)}}
function csv(){const g=group(ui.group);const as=state.assessments.filter(a=>a.groupId===g.id&&(ui.acourse==="all"||a.courseId===ui.acourse));const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 return [["Elev",...as.map(a=>a.title+" ("+a.date+")")].map(q).join(";"),...g.students.map(s=>[s.name,...as.map(a=>((state.grades[a.id]||{})[s.id]||{}).k||"")].map(q).join(";"))].join("\r\n")}

/* ---------- händelser ---------- */
const A={
 close:()=>closeModal(), ov:(el,e)=>{if(e.target===el)closeModal()},
 "clear-example":()=>confirmBox("Exempelkurserna, eleverna och omdömena tas bort. Läsåret och Lgr22-innehållet finns kvar.",()=>{const y=state.year;state=emptyState();state.year=y;ui={...ui,course:null,group:null,subjFilter:"all",acourse:"all",wheel:"all"};saveUI();commit()},"Töm Lärarbordet"),
 "load-example":()=>confirmBox("Exempeldata ersätter allt du har lagt in. Exportera först om du vill spara något.",()=>{state=exampleState();state.example=true;commit()},"Visa exempel"),
 wipe:()=>confirmBox("Allt raderas: kurser, planering, händelser, elever och omdömen.",()=>{state=emptyState();commit()},"Radera allt"),
 "sel-course":el=>{ui.course=el.dataset.id;saveUI();render()},
 "new-course":()=>courseModal(), "edit-course":el=>courseModal(el.dataset.id),
 "new-unit":()=>unitModal(), "edit-unit":el=>unitModal(el.dataset.id),
 wheel:el=>{ui.wheel=el.dataset.id;saveUI();render()},
 "new-event":()=>eventModal(), "edit-event":el=>eventModal(el.dataset.id),
 "goto-subject":el=>{ui.subject=el.dataset.id;ui.subjFilter="all";ui.gapsOnly=true;saveUI();location.hash="innehall"},
 "sel-subject":el=>{ui.subject=el.dataset.id;ui.subjFilter="all";saveUI();render()},
 gaps:el=>{ui.gapsOnly=el.dataset.v==="1";saveUI();render()},
 "toggle-manual":el=>{const id=el.dataset.id;if(state.manual[id])delete state.manual[id];else state.manual[id]=true;commit()},
 "add-item":el=>addItemModal(el.dataset.area),
 "del-item":el=>{const s=subj(ui.subject);s.areas.forEach(a=>a.items=a.items.filter(i=>i.id!==el.dataset.id));commit()},
 "sel-group":el=>{ui.group=el.dataset.id;saveUI();render()},
 "edit-group":el=>groupModal(el.dataset.id),
 "new-assess":()=>{if(!state.courses.length){modal("Skapa en kurs först",`<p style="margin:0">En bedömning hör till en kurs.</p><div class="actions"><a class="btn pri" href="#planering" data-a="close">Till planeringen</a></div>`);return}assessModal()},
 "edit-assess":el=>assessModal(el.dataset.id),
 grade:el=>gradeModal(el.dataset.as,el.dataset.st),
 student:el=>studentModal(el.dataset.g,el.dataset.id),
 "export-csv":()=>offerFile("omdomen-"+(group(ui.group)||{name:"grupp"}).name+".csv","﻿"+csv(),"text/csv"),
 "export-json":()=>offerFile("lararbordet-"+fmtD(TODAY)+".json",JSON.stringify(state,null,1),"application/json"),
 "import-json":()=>$("#importfile").click(),
 save:()=>saveFile(false), "save-as":()=>saveFile(true), "open-file":()=>desktopOpen(),
 "new-subject":()=>subjectModal(),
 "del-subject":el=>confirmBox("Ämnet och dess innehåll tas bort. Kurser i ämnet blir utan ämne.",()=>{delete state.subjects[el.dataset.id];commit()}),
 "save-year":()=>{const s=val("ys"),e=val("ye");if(s&&e&&e>s){state.year={start:s,end:e};commit()}},
 scale:el=>{const from=scale();const to=SCALES[el.value];if(!to||el.value===state.scale)return;
  Object.values(state.grades).forEach(m=>Object.values(m).forEach(v=>{const i=from.levels.findIndex(l=>l.k===v.k);if(i>=0)v.k=to.levels[Math.round(i/(from.levels.length-1)*(to.levels.length-1))].k}));state.scale=el.value;commit()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const f=A[el.dataset.a];if(!f)return;if(el.dataset.a==="scale")return;if(el.dataset.a==="ov"){if(e.target===el)closeModal();return}if(el.tagName!=="A")e.preventDefault();f(el,e)});
document.addEventListener("change",e=>{if(e.target.id==="subjfilter"){ui.subjFilter=e.target.value;saveUI();render()}if(e.target.id==="acourse"){ui.acourse=e.target.value;saveUI();render()}if(e.target.dataset.a==="scale")A.scale(e.target)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.key==="Enter"||e.key===" ")&&e.target.matches(".arc,[data-a='edit-event']")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
$("#importfile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{state=parsePlanbok(await f.text());state.example=false;commit();modal("Importerat",`<p style="margin:0">Datan är inläst: ${state.courses.length} kurser, ${state.units.length} arbetsområden, ${state.assessments.length} bedömningar.</p><div class="actions"><button class="btn pri" data-a="close">Klart</button></div>`)}catch(err){modal("Kunde inte importera",`<p style="margin:0">Filen kommer inte från Lärarbordet. Välj en exporterad .json eller en sparad lararbordet.html.</p><div class="actions"><button class="btn pri" data-a="close">OK</button></div>`)}e.target.value=""});
window.addEventListener("hashchange",()=>{closeModal();render();window.scrollTo(0,0)});

render();setSync();if(DESKTOP)desktopInit();
</script>
</body>
</html>
